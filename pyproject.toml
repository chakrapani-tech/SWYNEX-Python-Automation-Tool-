[project]
name = "swynex-intelligent-file-processing"
version = "0.1.0"
description = "SWYNEX Intelligent File Processing & Automation Platform"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["Flask>=3.0.0,<4.0.0"]

[tool.pytest.ini_options]
pythonpath = ["."]

[tool.mypy]
python_version = "3.11"
files = ["src", "main.py"]
explicit_package_bases = true
mypy_path = ["."]
warn_unused_ignores = true
warn_redundant_casts = true
check_untyped_defs = true
